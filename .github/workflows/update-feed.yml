name: Update feed

on:
  schedule:
    - cron: "7,37 * * * *"     # backup only: GitHub ran this once in 12 hours when it was all we had
  workflow_dispatch:           # the portfolio's server calls this every 10 min; also the "Run workflow" button

permissions:
  contents: write              # to commit docs/feed.json and data/

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # a queued run must start from the feed the run before it just committed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-base-en-v1.5

      - run: pip install -r pipeline/requirements.txt

      - name: Load state from the last published feed
        run: git fetch -q --depth=1 origin feed && git checkout FETCH_HEAD -- data || echo "No feed branch yet"

      - name: Fetch, filter, group
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FASTEMBED_CACHE_PATH: .cache/fastembed
        run: python -m pipeline.run

      - name: Commit the new feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json docs/search.json data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update feed" -q
          git pull --rebase -q && git push -q

      # One commit, force-pushed: GitHub Pages serves this branch, and main doesn't grow with every build.
      - name: Publish the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out/data"
          cp docs/feed.json docs/search.json "$RUNNER_TEMP/out/"
          cp data/*.json "$RUNNER_TEMP/out/data/"
          touch "$RUNNER_TEMP/out/.nojekyll"
          cd "$RUNNER_TEMP/out"
          git init -q -b feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update feed"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feed
