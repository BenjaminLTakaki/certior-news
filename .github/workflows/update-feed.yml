name: Update feed

on:
  schedule:
    - cron: "7,37 * * * *"     # every 30 min (off the hour; GitHub may still run it a bit late)
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write              # to commit docs/feed.json and data/

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch, filter, group
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FASTEMBED_CACHE_PATH: .cache/fastembed
        run: python -m pipeline.run

      - name: Commit the new feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update feed" -q
          git pull --rebase -q && git push -q
